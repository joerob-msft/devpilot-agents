name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A stacked review layer targets the branch below it,
  # not main, so a `branches: [main]` filter meant every layer opened without a
  # hosted run and the stack could only ever be checked after it landed - which
  # is exactly the moment the check stops being useful. Naming the feature
  # branches instead would rot on the next rename, so every pull request runs.
  pull_request:
  workflow_dispatch:

jobs:
  hygiene:
    name: Generic-toolkit invariant
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The premise of this repo is that it is generic. That claim erodes one
      # commit at a time unless it is checked mechanically.
      - name: No employer-specific values outside samples/
        shell: pwsh
        run: ./tools/Test-NoEmployerSpecifics.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer reported $($results.Count) error-severity finding(s)."
          }
          Write-Host "PSScriptAnalyzer: clean at Error severity."

  manifest:
    name: Module manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and import module
        shell: pwsh
        run: |
          $manifest = './src/DevPilot.AgentHarness/DevPilot.AgentHarness.psd1'
          $info = Test-ModuleManifest -Path $manifest
          Write-Host "Manifest OK: $($info.Name) $($info.Version), $($info.ExportedFunctions.Count) exported function(s)."
          Import-Module $manifest -Force
          # The asset resolver is what lets a consumer find prompts and fixtures
          # after installing the module; if it breaks, agents cannot start.
          $agents = Get-DevPilotAgentPath
          Write-Host "Agent assets resolved at: $agents"

  selfcheck:
    name: Agent self-checks (-DryRun)
    runs-on: windows-latest
    steps:
      # Full history: the escape ledger cites this repository's own commits and
      # the ledger check verifies that each one exists.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Offline by design: no network, no Azure DevOps, no Copilot process.
      - name: review-handler -DryRun
        shell: pwsh
        run: |
          ./src/Agents/review-handler/Start-ReviewHandlerAgent.ps1 -DryRun `
              -ConfigFile ./samples/apihub-ado.config.json

      - name: reviewer -DryRun
        shell: pwsh
        run: |
          ./src/Agents/reviewer/Start-ReviewerAgent.ps1 -DryRun `
              -ConfigFile ./samples/reviewer-ado.config.json

      - name: reviewer - two-pass preview is fail-closed
        shell: pwsh
        run: |
          # The pairing is derived from the supported-model registry, never
          # written down here: a workflow that names its own model version is
          # the same defect that spoiled a qualification set.
          Import-Module ./src/DevPilot.AgentHarness/DevPilot.AgentHarness.psd1 -Force
          $pair = Get-AgentGeneralistModelPair
          $scriptPath = './src/Agents/reviewer/Start-ReviewerAgent.ps1'
          $common = @(
              '-NoProfile', '-File', $scriptPath, '-DryRun',
              '-ConfigFile', './samples/reviewer-ado.config.json',
              '-Model', $pair.First, '-SecondPassModel', $pair.Second
          )

          & pwsh @common
          if ($LASTEXITCODE -ne 0) {
              throw "Two-pass preview self-check failed."
          }

          $blocked = @(
              @{ Name = 'finding comments'; Args = @('-EnableFindingComments') },
              @{ Name = 'summary comment'; Args = @('-EnableSummaryComment') },
              @{ Name = 'approval vote'; Args = @('-EnableFindingComments', '-EnableApprovalVote') },
              @{ Name = 'promotion'; Args = @('-PromotePreview', 'not-needed.json') }
          )
          $nativePreference = $PSNativeCommandUseErrorActionPreference
          try {
              # These child processes are expected to exit nonzero. Inspect that
              # status explicitly instead of letting the runner turn the first
              # expected rejection into a step-level NativeCommandError.
              $PSNativeCommandUseErrorActionPreference = $false
              foreach ($case in $blocked) {
                  $caseArgs = [string[]]$case.Args
                  $output = & pwsh @common @caseArgs 2>&1 | Out-String
                  if ($LASTEXITCODE -eq 0 -or $output -notmatch 'discovery-only') {
                      throw "Two-pass $($case.Name) did not fail closed at startup: $output"
                  }
              }
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = $nativePreference
          }
          # The final child is expected to exit 1. Do not let its LASTEXITCODE
          # become the aggregate step result after every assertion passed.
          exit 0

      - name: reviewer - PromoteVerifiedPreview is reachable regardless of the current process's pass count
        shell: pwsh
        run: |
          # Opus finding 1 (blocking): -PromoteVerifiedPreview re-authorizes
          # per its own sealed GATE artifact - it must never be gated by the
          # startup raw-authorization check, which only ever covers raw
          # direct delivery and raw -PromotePreview. Before the fix, a
          # two-pass-configured process (raw authorization = PreviewOnly)
          # threw at startup before ever reaching -PromoteVerifiedPreview,
          # making it unreachable from the most common configuration. Proven
          # here for both single-pass and two-pass startup configurations:
          # -DryRun exits 0 (reaching self-checks) rather than throwing at
          # parameter-resolution time, regardless of -SecondPassModel.
          $scriptPath = './src/Agents/reviewer/Start-ReviewerAgent.ps1'
          Import-Module ./src/DevPilot.AgentHarness/DevPilot.AgentHarness.psd1 -Force
          $pair = Get-AgentGeneralistModelPair
          $configs = @(
              @{ Name = 'single-pass'; Args = @('-Model', $pair.First) },
              @{ Name = 'two-pass'; Args = @('-Model', $pair.First, '-SecondPassModel', $pair.Second) }
          )
          foreach ($config in $configs) {
              $configArgs = [string[]]$config.Args
              $output = & pwsh -NoProfile -File $scriptPath -DryRun `
                  -ConfigFile ./samples/reviewer-ado.config.json @configArgs `
                  -PromoteVerifiedPreview 'does-not-exist.json' -EnableFindingComments 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                  throw "A $($config.Name) startup process rejected -PromoteVerifiedPreview before ever reaching it: $output"
              }
          }

      # Provider normalization, asserted against a fixture captured from a real
      # GitHub API response. Offline: no network, no host, no model.
      - name: provider self-checks
        shell: pwsh
        run: ./tools/Test-Provider.ps1

      - name: empty-to-null AST analyzer fixture measurement
        shell: pwsh
        run: ./tools/Test-PowerShellEmptyNullHazardAnalyzer.ps1

      # Boundary hardening. The fixture half proves each rule still detects its
      # own hazard and still ignores its own counterexample; the repository half
      # blocks any finding that is not in the recorded baseline. Existing
      # findings are debt, not approval.
      - name: PowerShell boundary hardening gate
        shell: pwsh
        run: ./tools/Test-PowerShellBoundaryHardening.ps1

      # The versioned file contract for stage child outputs: required kind and
      # contract version, caller-specified file, explicit depth and form, UTF-8
      # with no byte order mark, and fail-closed reads.
      - name: stage file contract enforcement
        shell: pwsh
        run: ./tools/Test-ReviewerStageContract.ps1

      # Adoption of that contract by the twelve real stage producers: each one
      # must call its boundary, consume the verdict, and reach it from its own
      # entry point. The suite reads the producers' syntax trees, so deleting a
      # call or assigning its verdict to $null fails here rather than silently
      # unwiring a boundary.
      - name: stage producer contract adoption
        shell: pwsh
        run: ./tools/Test-ReviewerStageProducerContract.ps1

      # The opt-in shadow path that puts the on-disk half of that contract in
      # force: all twelve boundaries publish through the atomic writer and read
      # straight back through the strict reader, and the reread verdict is
      # consumed. The suite proves the switch is off by default, refuses to open
      # while any delivery capability is live, and fails on every fault the
      # boundary exists to catch.
      - name: stage contract shadow adoption
        shell: pwsh
        run: ./tools/Test-ReviewerStageShadow.ps1

      # The rule a future C# coordinator has to satisfy, fixed before the port:
      # it consumes these schemas and may not carry prompt or verdict logic.
      - name: coordinator stage contract architecture
        shell: pwsh
        run: ./tools/Test-ReviewerCoordinatorContract.ps1

      # Custody and identity regressions exercise the shipping child boundaries
      # directly. They remain separate so a failure identifies the exact
      # authorization, wait, or evidence contract that drifted.
      - name: bounded coordinator child wait
        shell: pwsh
        run: ./tools/Test-ChildBoundedWait.ps1

      - name: stale run lease reclaim
        shell: pwsh
        run: ./tools/Test-RunLeaseReclaim.ps1

      - name: child request integrity
        shell: pwsh
        run: ./tools/Test-ShadowChildRequestIntegrity.ps1

      - name: slot terminal integrity
        shell: pwsh
        run: ./tools/Test-ShadowTerminalIntegrity.ps1

      - name: externally witnessed run execution
        shell: pwsh
        run: ./tools/Test-ShadowRunExecutionNonce.ps1

      - name: discovery candidate specialist parser
        shell: pwsh
        run: ./tools/Test-ReviewerDiscoveryCandidateSpecialistParser.ps1

      # The typed control plane itself. Restores and builds offline against an
      # empty feed, drives the full preparation from a typed request to an
      # immutable run-set-ready with no model and no slot, and proves the durable
      # state survives a kill at every transition. Runs the child fault matrix,
      # the lease conflict, the stale-head and tamper refusals, and a rollback
      # differential against the PowerShell preparation path.
      - name: shadow run coordinator
        shell: pwsh
        run: ./tools/Test-ShadowRunCoordinator.ps1

      # The sequential cohort above that coordinator. Runs a three-entry cohort
      # of stand-in preparations through a success, a supervised run that ended
      # other than complete, and a fault, under both stop policies; kills the
      # runner between entries and proves the resume neither re-attempts what
      # ended nor runs beside a live child; and exercises the global ceiling,
      # every identity refusal, the write and audit blocks, and the rebuildable
      # index. No model, no provider, nothing outside a temporary sandbox.
      - name: shadow cohort runner
        shell: pwsh
        run: ./tools/Test-ShadowCohortRunner.ps1

      # The typed cohort-entry evidence builder that feeds the cohort above:
      # exact wrapper-contract fixtures, one sabotage case per historical
      # operator-assembly incident (BOM, identity aliases, the raw ADO repository
      # shape, singleton arrays, exact-key nulls, a missing get_changes variant,
      # a drifted resource URI, a target-config mismatch, census ordering, and a
      # mutated read-only package), the cross-implementation prompt-asset digest
      # parity, and the typed coordinator driven over a package this builder
      # published. -IncludePreflight runs the coordinator assembly the step
      # above built from an empty offline feed, so nothing here reaches a
      # network. No model, no provider, nothing outside a temporary sandbox.
      - name: typed cohort-entry evidence builder
        shell: pwsh
        run: ./tools/Test-ShadowCohortEntryEvidence.ps1 -IncludePreflight

      # Every inventoried collection field at zero, one, many, maximum,
      # duplicate, null-versus-missing, and wrong-scalar, plus the escape-shape
      # properties and the sabotage suite that proves each historical collapse
      # is still detected.
      - name: collection cardinality corpus
        shell: pwsh
        run: ./tools/Test-ReviewerCollectionCardinality.ps1

      # The escape ledger must agree with its own arithmetic: counts recomputed
      # from the incident list, the registered budget trigger re-evaluated, and
      # the narrative kept in step with the data.
      - name: escape ledger and budget
        shell: pwsh
        run: ./tools/Test-EscapeLedger.ps1 -VerifyCommits

      # The signed map from the pre-consolidation commits the ledger cites to the
      # replacement commits that carry them. A ledger citation that is no longer
      # an ancestor of HEAD is satisfied only through an exact mapping whose
      # anchors, trees and carried evidence all verify, so a squashed history
      # cannot quietly erase - or quietly invent - a reachability claim.
      - name: escape ledger consolidation mapping
        shell: pwsh
        run: ./tools/Test-EscapeLedgerConsolidation.ps1

      # The versioned reviewer-base contract that replaced 'is this legacy commit
      # an ancestor'. Identity is the accepted tree plus the reviewer script,
      # config and schema hashes, so an unrelated tree with a copied commit
      # message still fails.
      - name: reviewer base lineage contract
        shell: pwsh
        run: ./tools/Test-ReviewerBaseContract.ps1

      # The census of what a run actually spent, believed because it is signed
      # rather than because the files on disk have the right shape: forged logs,
      # added, removed and rewritten previews, swapped inputs, wrong and missing
      # keys, and the proof that blocking never lowers a count.
      - name: model start census authenticity
        shell: pwsh
        run: ./tools/Test-ShadowModelStartCensus.ps1

      # The oversized-input refusal is bounded: every branch publishes the closed
      # result shape, the attempt is charged, and it terminates.
      - name: bounded refusal result shape
        shell: pwsh
        run: ./tools/Test-ReviewerModelPassResultShape.ps1

      # Publishing state atomically while a reader holds the file open. On
      # Windows a sharing violation used to leave the launch-intent and state
      # files wedged; this drives real concurrent readers and writers and proves
      # the published file is only ever the old bytes or the new ones.
      - name: atomic state publish under concurrent readers
        shell: pwsh
        run: ./tools/Test-AtomicStatePublish.ps1

      # The managed sealing helper and the PowerShell canonicalizers must agree
      # byte for byte, or a seal written by one and verified by the other would
      # disagree about what was sealed. The script restores and builds the
      # helper from an empty offline source, so this step proves the offline
      # build too. Private parity samples are optional and absent here; the
      # script says so rather than pretending it checked them.
      - name: seal canonicalization parity (offline build)
        shell: pwsh
        run: ./tools/Test-SealParity.ps1

      - name: convention-pack schema and replay checks
        shell: pwsh
        run: ./tools/Test-ConventionPacks.ps1

      # The first activated convention capability. These checks decide whether
      # a compliant declaration can be reported as a violation (a combined
      # attribute list read as a missing attribute), and whether a correct
      # finding survives the trip back through the result contract - the live
      # replay lost one to a single unreadable evidence field.
      - name: test-ownership capability checks
        shell: pwsh
        run: ./tools/Test-ConventionOwnerCapability.ps1

      # The preview that composes the existing tools into one Owner run over one
      # pull request. These checks validate the three documents it authors
      # against the SAME published schemas the production tools read, so a drift
      # in either fails here rather than several minutes into a live capture.
      # They also pin the two properties that make the layer safe to leave
      # running: a changed head, rule, model or toolkit produces a different
      # subject rather than overwriting one, and a marker that never parsed is
      # reported incomplete rather than as a clean review. The nine-declaration
      # case is read out of the recorded corpus, not copied from it. No network,
      # no model, no provider.
      - name: owner convention preview
        shell: pwsh
        run: ./tools/Test-OwnerPreviewCycle.ps1

      # Layer 2: a declared queue and Windows Task Scheduler wrapper around the
      # proven prepare-run seam. Entirely offline: fake cycle driver, no provider,
      # no model, no task registration, and no app session/worktree creation.
      - name: owner convention preview queue
        shell: pwsh
        run: ./tools/Test-OwnerPreviewQueue.ps1

      # Layer 8: the sealed changed-file source transport. The model has no
      # working file-read tool on this host, so the wrapper reads the pinned
      # bytes itself; these checks pin the slicing, the hash binding, the
      # closed omission-reason set, and the fail-closed coverage floor that
      # stops a review being reported from files nobody read.
      - name: sealed source-transport slicing, accounting, and coverage floor
        shell: pwsh
        run: ./tools/Test-SourceTransport.ps1

      - name: deterministic review-fact schema and replay checks
        shell: pwsh
        run: ./tools/Test-ReviewFacts.ps1

      - name: convention-specialist isolation and schema checks
        shell: pwsh
        run: ./tools/Test-ConventionSpecialist.ps1

      # The v2 generalist response contract: nonce challenge extraction, payload
      # bounds, auth-tier classification, envelope sealing, and the offline
      # adapter round trip. Offline by construction - the only process it starts
      # is the committed deterministic adapter.
      - name: generalist model response envelope v2
        shell: pwsh
        run: ./tools/Test-ReviewerModelResponseEnvelope.ps1

      # Layer 9: offline snapshot replay of the whole read seam, and the
      # specialist's rule-coverage accounting. Offline by construction: the
      # checks drive a committed synthetic snapshot with no host, no network
      # and no model.
      - name: replay-snapshot integrity and rule-coverage accounting
        shell: pwsh
        run: ./tools/Test-ReplaySnapshot.ps1

      - name: reviewer qualification git-identity policy
        shell: pwsh
        run: ./tools/Test-ReviewerQualificationPreflight.ps1

      # The qualification INVOCATION itself: the derived generalist pairing, the
      # single constructed argv per slot, and the binding of that argv through
      # the agent itself, in its -QualificationPrelaunch mode, which stops at the
      # agent's own model-launch boundary before creating any state.
      # Offline: the checks build a sandbox reviewer build and drive the
      # committed synthetic snapshot, with no host, no network and no model.
      - name: reviewer replay-qualification invocation checks
        shell: pwsh
        run: ./tools/Test-ReviewerReplayQualification.ps1

      - name: reviewer deterministic adapter process and parser checks
        shell: pwsh
        run: ./tools/Test-ReviewerAdapterBehaviors.ps1

      - name: exact-path deterministic reviewer orchestration
        shell: pwsh
        run: ./tools/Test-ReviewerExactPath.ps1

      - name: reviewer structural coverage golden
        shell: pwsh
        run: ./tools/Test-ReviewerStructuralCoverage.ps1

      # Blinded transcript acquisition: the outer supervisor and the reviewer's
      # gated acquisition mode, driven only by the sealed offline stub adapter.
      # Offline and deterministic: no network, no ADO/GitHub, no provider process,
      # no real model - it captures raw stimulus and seals an oracle-free package.
      - name: blinded transcript acquisition runner
        shell: pwsh
        run: ./tools/Test-ReviewerBlindedAcquisition.ps1

      - name: blinded benchmark-pack materializer and no-model preflight
        shell: pwsh
        run: ./tools/Test-ReviewerBenchmarkPackMaterializer.ps1

      # Proves the no-model production role input capture builds the EXACT
      # production prompt for one role, byte-identical to the blinded adapter
      # path, while starting zero model/agency/provider processes and writing
      # zero plans, tokens, leases or provider state.
      - name: reviewer - no-model production role input capture
        shell: pwsh
        run: ./tools/Test-ReviewerRoleInputCapture.ps1

      - name: reviewer - offline replay is fail-closed and preview-only
        shell: pwsh
        run: |
          $scriptPath = './src/Agents/reviewer/Start-ReviewerAgent.ps1'
          $replayRoot = './src/Agents/reviewer/testdata/replay-v1'
          $digest = (Get-Content './src/Agents/reviewer/testdata/replay-v1/synthetic-pr/manifest.json' -Raw |
              ConvertFrom-Json).manifestDigest
          Import-Module ./src/DevPilot.AgentHarness/DevPilot.AgentHarness.psd1 -Force
          $pair = Get-AgentGeneralistModelPair
          $common = @(
              '-NoProfile', '-File', $scriptPath,
              '-ConfigFile', './samples/reviewer-ado.config.json',
              '-Model', $pair.First, '-OperatorAlias', 'example-operator',
              '-ReplayRoot', $replayRoot, '-ReplaySnapshotName', 'synthetic-pr',
              '-ReplayManifestDigest', $digest
          )
          function ConvertTo-FlatDiagnostic {
              param([Parameter(Mandatory)][string]$Text)
              $flat = $Text -replace "`e\][^`a`e]*(`a|`e\\)", ''
              $flat = $flat -replace "`e\[[0-9;?]*[A-Za-z]", ''
              return (($flat -replace '\s*\|\s*', ' ') -replace '\s+', ' ').Trim()
          }
          # Every one of these must be refused at startup, before any session
          # exists. A replay that could post is not a replay.
          $blocked = @(
              @{ Name = 'finding comments'; Args = @('-EnableFindingComments'); Expect = 'preview-only' },
              @{ Name = 'summary comment'; Args = @('-EnableSummaryComment'); Expect = 'preview-only' },
              @{ Name = 'approval vote'; Args = @('-EnableFindingComments', '-EnableApprovalVote'); Expect = 'preview-only' },
              @{ Name = 'raw promotion'; Args = @('-PromotePreview', 'not-needed.json'); Expect = 'preview-only' },
              @{ Name = 'verified promotion'; Args = @('-PromoteVerifiedPreview', 'not-needed.json'); Expect = 'preview-only' },
              @{ Name = 'comment gate'; Args = @('-EnableVerifiedCommentGate'); Expect = 'preview-only' },
              @{ Name = 'approval gate'; Args = @('-EnableVerifiedApprovalGate'); Expect = 'preview-only' },
              @{ Name = 'self-checks'; Args = @('-DryRun'); Expect = 'cannot be combined with offline replay' }
          )
          $nativePreference = $PSNativeCommandUseErrorActionPreference
          try {
              $PSNativeCommandUseErrorActionPreference = $false
              foreach ($case in $blocked) {
                  $caseArgs = [string[]]$case.Args
                  $output = & pwsh @common @caseArgs 2>&1 | Out-String
                  $normalizedOutput = ConvertTo-FlatDiagnostic -Text $output
                  if ($LASTEXITCODE -eq 0 -or $normalizedOutput -notmatch [regex]::Escape($case.Expect)) {
                      throw "Replay with $($case.Name) did not fail closed at startup: $output"
                  }
              }
              # An incomplete replay invocation is refused rather than guessed at.
              $partial = & pwsh -NoProfile -File $scriptPath -ConfigFile './samples/reviewer-ado.config.json' `
                  -Model $pair.First -OperatorAlias 'example-operator' -ReplayRoot $replayRoot 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0 -or
                  (ConvertTo-FlatDiagnostic -Text $partial) -notmatch [regex]::Escape('requires all of')) {
                  throw "A partial replay invocation was not refused: $partial"
              }
              # The snapshot itself is not for this repository's configuration,
              # so a replay of it must refuse rather than review the wrong PR.
              $mismatch = & pwsh @common -PullRequestId 4242 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0 -or
                  (ConvertTo-FlatDiagnostic -Text $mismatch) -notmatch [regex]::Escape('cannot be replayed under this configuration')) {
                  throw "A snapshot captured for another repository was not refused: $mismatch"
              }
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = $nativePreference
          }
          exit 0

      - name: cross-verification isolation, replay, and schema checks
        shell: pwsh
        run: ./tools/Test-CrossVerification.ps1

      # Layer 6: fail-closed comment/approval-vote eligibility gates over the
      # sealed cross-verification preview. Offline: no network, no ADO/GitHub,
      # no Copilot process, no model - every gate decision is a pure function
      # of sealed inputs.
      - name: delivery-gate policy, qualification, and decision checks
        shell: pwsh
        run: ./tools/Test-DeliveryGates.ps1

      # Layer 7: the evaluation harness over a frozen, blind-labeled corpus.
      # Offline and deterministic: exact integer confidence bounds, sealed
      # non-promotable artifacts, and a shipped seed corpus that must qualify
      # nothing.
      - name: evaluation corpus, adjudication, metric, and qualification checks
        shell: pwsh
        run: ./tools/Test-ReviewerEvaluation.ps1