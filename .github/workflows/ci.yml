name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hygiene:
    name: Generic-toolkit invariant
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The premise of this repo is that it is generic. That claim erodes one
      # commit at a time unless it is checked mechanically.
      - name: No employer-specific values outside samples/
        shell: pwsh
        run: ./tools/Test-NoEmployerSpecifics.ps1

  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer reported $($results.Count) error-severity finding(s)."
          }
          Write-Host "PSScriptAnalyzer: clean at Error severity."

  manifest:
    name: Module manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and import module
        shell: pwsh
        run: |
          $manifest = './src/DevPilot.AgentHarness/DevPilot.AgentHarness.psd1'
          $info = Test-ModuleManifest -Path $manifest
          Write-Host "Manifest OK: $($info.Name) $($info.Version), $($info.ExportedFunctions.Count) exported function(s)."
          Import-Module $manifest -Force
          # The asset resolver is what lets a consumer find prompts and fixtures
          # after installing the module; if it breaks, agents cannot start.
          $agents = Get-DevPilotAgentPath
          Write-Host "Agent assets resolved at: $agents"

  selfcheck:
    name: Agent self-checks (-DryRun)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Offline by design: no network, no Azure DevOps, no Copilot process.
      - name: review-handler -DryRun
        shell: pwsh
        run: |
          ./src/Agents/review-handler/Start-ReviewHandlerAgent.ps1 -DryRun `
              -ConfigFile ./samples/apihub-ado.config.json

      - name: reviewer -DryRun
        shell: pwsh
        run: |
          ./src/Agents/reviewer/Start-ReviewerAgent.ps1 -DryRun `
              -ConfigFile ./samples/reviewer-ado.config.json

      - name: reviewer - two-pass preview is fail-closed
        shell: pwsh
        run: |
          $scriptPath = './src/Agents/reviewer/Start-ReviewerAgent.ps1'
          $common = @(
              '-NoProfile', '-File', $scriptPath, '-DryRun',
              '-ConfigFile', './samples/reviewer-ado.config.json',
              '-Model', 'claude-opus-5', '-SecondPassModel', 'gpt-5.6-sol'
          )

          & pwsh @common
          if ($LASTEXITCODE -ne 0) {
              throw "Two-pass preview self-check failed."
          }

          $blocked = @(
              @{ Name = 'finding comments'; Args = @('-EnableFindingComments') },
              @{ Name = 'summary comment'; Args = @('-EnableSummaryComment') },
              @{ Name = 'approval vote'; Args = @('-EnableFindingComments', '-EnableApprovalVote') },
              @{ Name = 'promotion'; Args = @('-PromotePreview', 'not-needed.json') }
          )
          $nativePreference = $PSNativeCommandUseErrorActionPreference
          try {
              # These child processes are expected to exit nonzero. Inspect that
              # status explicitly instead of letting the runner turn the first
              # expected rejection into a step-level NativeCommandError.
              $PSNativeCommandUseErrorActionPreference = $false
              foreach ($case in $blocked) {
                  $caseArgs = [string[]]$case.Args
                  $output = & pwsh @common @caseArgs 2>&1 | Out-String
                  if ($LASTEXITCODE -eq 0 -or $output -notmatch 'discovery-only') {
                      throw "Two-pass $($case.Name) did not fail closed at startup: $output"
                  }
              }
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = $nativePreference
          }
          # The final child is expected to exit 1. Do not let its LASTEXITCODE
          # become the aggregate step result after every assertion passed.
          exit 0

      - name: reviewer - PromoteVerifiedPreview is reachable regardless of the current process's pass count
        shell: pwsh
        run: |
          # Opus finding 1 (blocking): -PromoteVerifiedPreview re-authorizes
          # per its own sealed GATE artifact - it must never be gated by the
          # startup raw-authorization check, which only ever covers raw
          # direct delivery and raw -PromotePreview. Before the fix, a
          # two-pass-configured process (raw authorization = PreviewOnly)
          # threw at startup before ever reaching -PromoteVerifiedPreview,
          # making it unreachable from the most common configuration. Proven
          # here for both single-pass and two-pass startup configurations:
          # -DryRun exits 0 (reaching self-checks) rather than throwing at
          # parameter-resolution time, regardless of -SecondPassModel.
          $scriptPath = './src/Agents/reviewer/Start-ReviewerAgent.ps1'
          $configs = @(
              @{ Name = 'single-pass'; Args = @('-Model', 'claude-opus-5') },
              @{ Name = 'two-pass'; Args = @('-Model', 'claude-opus-5', '-SecondPassModel', 'gpt-5.6-sol') }
          )
          foreach ($config in $configs) {
              $configArgs = [string[]]$config.Args
              $output = & pwsh -NoProfile -File $scriptPath -DryRun `
                  -ConfigFile ./samples/reviewer-ado.config.json @configArgs `
                  -PromoteVerifiedPreview 'does-not-exist.json' -EnableFindingComments 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                  throw "A $($config.Name) startup process rejected -PromoteVerifiedPreview before ever reaching it: $output"
              }
          }

      # Provider normalization, asserted against a fixture captured from a real
      # GitHub API response. Offline: no network, no host, no model.
      - name: provider self-checks
        shell: pwsh
        run: ./tools/Test-Provider.ps1

      - name: convention-pack schema and replay checks
        shell: pwsh
        run: ./tools/Test-ConventionPacks.ps1

      # Layer 8: the sealed changed-file source transport. The model has no
      # working file-read tool on this host, so the wrapper reads the pinned
      # bytes itself; these checks pin the slicing, the hash binding, the
      # closed omission-reason set, and the fail-closed coverage floor that
      # stops a review being reported from files nobody read.
      - name: sealed source-transport slicing, accounting, and coverage floor
        shell: pwsh
        run: ./tools/Test-SourceTransport.ps1

      - name: deterministic review-fact schema and replay checks
        shell: pwsh
        run: ./tools/Test-ReviewFacts.ps1

      - name: convention-specialist isolation and schema checks
        shell: pwsh
        run: ./tools/Test-ConventionSpecialist.ps1

      - name: cross-verification isolation, replay, and schema checks
        shell: pwsh
        run: ./tools/Test-CrossVerification.ps1

      # Layer 6: fail-closed comment/approval-vote eligibility gates over the
      # sealed cross-verification preview. Offline: no network, no ADO/GitHub,
      # no Copilot process, no model - every gate decision is a pure function
      # of sealed inputs.
      - name: delivery-gate policy, qualification, and decision checks
        shell: pwsh
        run: ./tools/Test-DeliveryGates.ps1

      # Layer 7: the evaluation harness over a frozen, blind-labeled corpus.
      # Offline and deterministic: exact integer confidence bounds, sealed
      # non-promotable artifacts, and a shipped seed corpus that must qualify
      # nothing.
      - name: evaluation corpus, adjudication, metric, and qualification checks
        shell: pwsh
        run: ./tools/Test-ReviewerEvaluation.ps1